<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>LifeworkPath</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0d1b2e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LifeworkPath" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="description" content="LifeworkPath career analysis: find work that fits who you are." />

    <style>
      .site-bootstrap {
        align-items: center;
        background: #f6f1e9;
        color: #112238;
        display: flex;
        flex-direction: column;
        font-family: Georgia, serif;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
      }
      .site-bootstrap__wordmark { font-size: 2rem; letter-spacing: -0.04em; }
      .site-bootstrap__wordmark em { color: #b8862f; font-style: italic; }
      .site-bootstrap__message { font: 600 0.66rem/1.4 Inter, sans-serif; letter-spacing: 0.15em; margin: 18px 0 0; text-transform: uppercase; }
    </style>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Inter:wght@300;400;500;600&family=Libre+Franklin:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400;1,8..60,500&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"><div class="site-bootstrap" role="status" aria-live="polite"><div class="site-bootstrap__wordmark">Life<em>work</em></div><p class="site-bootstrap__message">Opening LifeworkPath</p></div></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>

    <!-- Register service worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function (err) {
            console.warn('Service worker registration failed:', err);
          });
        });
      }
    </script>
  </body>

</html>
